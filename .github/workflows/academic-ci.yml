name: Academic isolated verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic-local:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      SUPABASE_TELEMETRY_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # Sequential: never share the owned 55420/55520 ports between gates.
      - run: npm run verify:isolated -- --suite all --fixture academic
      - run: npm run verify:restore
      # No secret env, remote project, dump upload, artifact upload or deploy.
